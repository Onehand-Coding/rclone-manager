[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rclone-manager-cli"
version = "1.0.0"
description = "A CLI tool to simplify common rclone operations."
readme = "README.md"
requires-python = ">=3.8"

dependencies = [
    "python-dotenv",
    "rich",
    "markdown-it-py",
    "mdurl",
    "pygments",
    #"streamlit",
]
[project.optional-dependencies]
dev = [
    "ruff>=0.15.9",
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
]
gui = ["streamlit"]

[project.scripts]
rclone-manager = "rclone_manager.cli:main"

# This tells Hatchling exactly which directory contains the package.
[tool.hatch.build.targets.wheel]
packages = ["src/rclone_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require rclone (deselect with '-m \"not integration\"')",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
