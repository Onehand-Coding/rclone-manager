[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rclone-manager-cli"
version = "1.0.0"
description = "A CLI tool to simplify common rclone operations."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "python-dotenv",
    "rich",
]
[project.optional-dependencies]
dev = [
    "ruff>=0.15.9",
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
]
gui = ["streamlit"]

[project.scripts]
rclone-manager = "rclone_manager.cli:main"

# This tells Hatchling exactly which directory contains the package.
[tool.hatch.build.targets.wheel]
packages = ["src/rclone_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require rclone (deselect with '-m \"not integration\"')",
]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]

[tool.ruff.lint]
select = ["F", "E", "W", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106", "S107"]
"src/rclone_manager/ports.py" = ["S603"]
"src/rclone_manager/webui.py" = ["S603", "S607"]
"src/rclone_manager/webui_launcher.py" = ["S104", "S603", "S607"]
