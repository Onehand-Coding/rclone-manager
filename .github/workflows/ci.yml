name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.10
      - run: uv sync --extra dev --python 3.10
      - run: uv run ruff check src/

  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --extra dev --extra gui --python ${{ matrix.python-version }}
      - run: uv run pytest tests/unit -v --cov --cov-report=term-missing --cov-fail-under=75

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.11
      - run: uv sync --extra dev --python 3.11
      - run: sudo apt-get update && sudo apt-get install -y rclone
      - run: uv run pytest tests/integration -v
